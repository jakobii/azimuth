[package]
name = "azimuth"
version = "0.1.0"
edition = "2024"
description = "Plan moon-over-landmark photos: moon path lines as GeoJSON on OpenStreetMap"
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
